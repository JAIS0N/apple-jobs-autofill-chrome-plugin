<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apple Careers Autofill</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    width: 300px; background: #0a0a0a; color: #f0f0f0;
    padding: 16px; user-select: none;
  }
  .header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; padding-bottom: 12px;
    border-bottom: 1px solid #1e1e1e;
  }
  .logo {
    width: 28px; height: 28px; background: #fff; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .title  { font-size: 13px; font-weight: 600; color: #f0f0f0; line-height: 1.2; }
  .subtitle { font-size: 11px; color: #555; margin-top: 1px; }
  .label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: #444; margin-bottom: 6px;
  }
  textarea {
    width: 100%; height: 140px;
    background: #0f0f0f; border: 1px solid #222; border-radius: 8px;
    color: #ccc; font-family: 'DM Sans', sans-serif;
    font-size: 11px; line-height: 1.5; padding: 9px 10px;
    resize: vertical; outline: none; transition: border-color 0.15s;
    margin-bottom: 8px;
  }
  textarea:focus { border-color: #2a5aff55; }
  textarea::placeholder { color: #2e2e2e; }
  .btn {
    width: 100%; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #2a5aff44; background: #0d1a3a; color: #6699ff;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; text-align: center; transition: all 0.15s;
  }
  .btn:hover  { background: #122050; border-color: #2a5aff88; color: #88aaff; }
  .btn:active { transform: scale(0.98); }
  .status {
    font-size: 11px; color: #444; min-height: 16px;
    transition: color 0.2s; text-align: center; margin-top: 8px;
  }
  .status.success { color: #33d98a; }
  .status.error   { color: #ff5555; }
  .status.info    { color: #6699ff; }
  .divider { border: none; border-top: 1px solid #1a1a1a; margin: 12px 0; }
  .footer  { font-size: 10px; color: #2e2e2e; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">🍎</div>
  <div>
    <div class="title">Apple Careers Autofill</div>
    <div class="subtitle">jobs.apple.com</div>
  </div>
</div>

<div class="label">Paste LaTeX resume</div>
<textarea id="latex-input" placeholder="Paste your LaTeX resume here…"></textarea>
<button class="btn" id="btn-fill">Autofill job descriptions</button>
<div class="status" id="status">Navigate to the Profile Information step first</div>

<hr class="divider">
<div class="footer">Parses \company{} blocks and fills matching employer fields</div>

<script src="popup.js"></script>
</body>
</html>
