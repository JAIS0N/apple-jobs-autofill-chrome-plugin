<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Careers Autofill</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    width: 260px;
    background: #0a0a0a;
    color: #f0f0f0;
    padding: 20px;
    user-select: none;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid #1e1e1e;
  }

  .logo {
    width: 28px;
    height: 28px;
    background: #fff;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .title {
    font-size: 13px;
    font-weight: 600;
    color: #f0f0f0;
    line-height: 1.2;
  }

  .subtitle {
    font-size: 11px;
    color: #555;
    margin-top: 1px;
  }

  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #444;
    margin-bottom: 8px;
  }

  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }

  .btn {
    width: 100%;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid #222;
    background: #111;
    color: #e0e0e0;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.15s;
  }

  .btn:hover {
    background: #181818;
    border-color: #333;
    color: #fff;
  }

  .btn:active { transform: scale(0.98); }

  .btn.ml:hover { border-color: #2a5aff44; background: #0d1a3a; color: #6699ff; }
  .btn.sde:hover { border-color: #00c47444; background: #0a2a1a; color: #33d98a; }

  .btn-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 4px;
    background: #1e1e1e;
    color: #555;
  }

  .btn.ml .btn-tag { background: #0d1a3a; color: #3366cc; }
  .btn.sde .btn-tag { background: #0a2a1a; color: #1a7a4a; }

  .status {
    font-size: 11px;
    color: #444;
    min-height: 16px;
    transition: color 0.2s;
    text-align: center;
  }

  .status.success { color: #33d98a; }
  .status.error { color: #ff5555; }
  .status.info { color: #6699ff; }

  .divider {
    border: none;
    border-top: 1px solid #1a1a1a;
    margin: 14px 0;
  }

  .footer {
    font-size: 10px;
    color: #333;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🍎</div>
  <div>
    <div class="title">Apple Careers Autofill</div>
    <div class="subtitle">jobs.apple.com</div>
  </div>
</div>

<div class="label">Select resume type</div>

<div class="btn-group">
  <button class="btn ml" id="btn-ml">
    Machine Learning
    <span class="btn-tag">ML</span>
  </button>
  <button class="btn sde" id="btn-sde">
    Software Engineer
    <span class="btn-tag">SDE</span>
  </button>
</div>

<div class="status" id="status">Navigate to the Profile Information step first</div>

<hr class="divider">
<div class="footer">Fills job descriptions by matching employer names in the form</div>

<script src="popup.js"></script>
</body>
</html>
